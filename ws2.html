<!DOCTYPE html>
<html>
<head>
    <title></title>
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $("#BTNSERVICE").click(function (event) {
                event.preventDefault();

                var webserUrl = "http://121.167.154.140:86/WebService1.asmx";
                var soapRequest = '<?xml version="1.0" encoding="utf-8"?>'
                    + '<soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"'
                    + ' xmlns:xsd="http://www.w3.org/2001/XMLSchema"'
                    + ' xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">'
                    + '  <soap:Body>'
                    + '    <SelectTest xmlns="http://mt8848.kr/" />'
                    + '  </soap:Body>'
                    + '</soap:Envelope>';

                $.ajax({
                    type: "POST",
                    url: webserUrl,
                    contentType: "text/xml; charset=utf-8",
                    dataType: "xml",
                    data: soapRequest,
                    headers: { "SOAPAction": "http://mt8848.kr/SelectTest" },
                    success: function (data) {
                        var result = $(data).find("SelectTestResult").text();
                        alert("결과: " + result);
                    },
                    error: function (xhr, status, err) {
                        alert("오류: " + xhr.responseText + "\n" + status);
                    }
                });
            });
        });
    </script>
</head>
<body>
    <button id="BTNSERVICE">웹서비스 호출</button>
    SAMPLE Application to test service
</body>
</html>
