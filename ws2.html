<!DOCTYPE html>
<html>
<head>
    <title>WS2 Test</title>
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <style>
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #aaa; padding: 6px 12px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
    <script type="text/javascript">
    $(document).ready(function () {
        $("#BTNSERVICE").click(function (event) {
            event.preventDefault();

            var tableName = $("#TABLE_NAME").val().trim();
            var condition = $("#CONDITION").val().trim();
            if (!tableName) {
                alert("테이블명을 입력하세요.");
                return;
            }

            var webserUrl = "https://web.mt8848.kr:444/WebService1.asmx/SelectTable";

            $.ajax({
                type: "GET",
                url: webserUrl,
                data: {
                    table_name: tableName,
                    condition: condition
                },
                dataType: "xml",
                success: function (data) {
                    var root = data.documentElement;

                    // xsi:nil="true" 이면 데이터 없음
                    var isNil = root.getAttributeNS("http://www.w3.org/2001/XMLSchema-instance", "nil") === "true";
                    if (isNil) {
                        $("#result").html("<p>데이터 없음</p>");
                        return;
                    }

                    // xs:schema 에서 컬럼명 순서대로 추출
                    var xsNS = "http://www.w3.org/2001/XMLSchema";
                    var cols = [];
                    var schemaEls = root.getElementsByTagNameNS(xsNS, "schema");
                    if (schemaEls.length > 0) {
                        var xsElements = schemaEls[0].getElementsByTagNameNS(xsNS, "element");
                        for (var i = 0; i < xsElements.length; i++) {
                            var el = xsElements[i];
                            if (el.parentNode && el.parentNode.localName === "sequence") {
                                cols.push(el.getAttribute("name"));
                            }
                        }
                    }

                    // diffgr:diffgram > DocumentElement > Table 행 추출
                    var diffgramNS = "urn:schemas-microsoft-com:xml-diffgram-v1";
                    var rows = [];
                    var diffgramEls = root.getElementsByTagNameNS(diffgramNS, "diffgram");
                    if (diffgramEls.length > 0) {
                        var docEl = diffgramEls[0].getElementsByTagName("DocumentElement")[0];
                        if (docEl) {
                            for (var i = 0; i < docEl.childNodes.length; i++) {
                                if (docEl.childNodes[i].nodeType === 1) rows.push(docEl.childNodes[i]);
                            }
                        }
                    }

                    // 스키마 없으면 첫 행에서 컬럼명 추출
                    if (cols.length === 0 && rows.length > 0) {
                        for (var j = 0; j < rows[0].childNodes.length; j++) {
                            if (rows[0].childNodes[j].nodeType === 1) cols.push(rows[0].childNodes[j].localName);
                        }
                    }

                    if (rows.length === 0) {
                        $("#result").html("<p>데이터 없음</p>");
                        return;
                    }

                    // 테이블 렌더링
                    var html = "<table><thead><tr>";
                    cols.forEach(function (col) { html += "<th>" + col + "</th>"; });
                    html += "</tr></thead><tbody>";

                    rows.forEach(function (row) {
                        html += "<tr>";
                        cols.forEach(function (col) {
                            var cell = row.getElementsByTagName(col)[0];
                            html += "<td>" + (cell ? (cell.textContent || "") : "") + "</td>";
                        });
                        html += "</tr>";
                    });

                    html += "</tbody></table>";
                    $("#result").html(html);
                },
                error: function (xhr, status, err) {
                    alert("오류: " + xhr.responseText + "\n" + status);
                }
            });
        });
    });
    </script>
</head>
<body>
    <input type="text" id="TABLE_NAME" placeholder="테이블명 입력(eX.INFORMATION_SCHEMA.TABLES)" style="width:200px; padding:4px;" /><br>
    <input type="text" id="CONDITION" placeholder="조건 입력" style="width:400px; padding:4px;" />
    <button id="BTNSERVICE">웹서비스 호출</button>
    <div id="result"></div>
</body>
</html>
